name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check 'src/**/*.ts'

      - name: ESLint
        run: npm run lint

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build prod bundle
        run: npm run build:prod

  # NOTE: Playwright e2e is intentionally NOT in this workflow yet.
  # The "clean" specs (e2e/clean/loader.spec.ts) require a CPI to
  # auth against the live argus API and AWS creds to read DDB for
  # the post-run record assertion — they're not localhost-only despite
  # the name. To enable, add an `e2e` workflow that:
  #   - takes ARGUS_TEST_CPI from secrets
  #   - assumes a read-only AWS role via OIDC
  #   - runs `npm run test:e2e`
  # The adversarial specs depend on live SOAX/Bright Data/Tor and
  # should stay manual/nightly only.
