<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Integrity VM Test</title>
</head>
<body>
  <div id="status">idle</div>
  <pre id="result"></pre>
  <script src="/dist/argus-integrity.iife.js"></script>
  <script>
    const API_BASE = 'https://api-dev-jw.argus.pw';
    const SIGINT_CONFIG = { baseDomain: 'argus.pw', stagePrefix: 'dev-jw-' };

    window.__runIntegrity = async function () {
      const el = document.getElementById('status');
      const out = document.getElementById('result');
      el.textContent = 'running';

      try {
        // 1. Prefetch (starts h2-probe + bytecode load)
        ArgusIntegrity.prefetchArgusVm(SIGINT_CONFIG);

        // 2. Collect fingerprint
        const fp = await ArgusIntegrity.collectIntegrity();

        // 3. Run VM (ECDH encrypt + POST to /v1/integrity-collect)
        const vm = await ArgusIntegrity.runArgusVm(fp, API_BASE, SIGINT_CONFIG);

        const payload = {
          sessionId: vm.sessionId,
          tampered: vm.tampered,
          vmSignals: vm.vmSignals,
          vmHash: vm.vmHash,
          fingerprint: fp,
        };
        out.textContent = JSON.stringify(payload, null, 2);
        el.textContent = vm.sessionId ? 'ok' : 'no-session';
      } catch (err) {
        out.textContent = err.message + '\n' + err.stack;
        el.textContent = 'error';
      }
    };
  </script>
</body>
</html>
