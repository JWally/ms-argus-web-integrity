<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argus Integrity — Local Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a1a; color: #eee; padding: 16px; max-width: 900px; }
    h1 { color: #88f; margin-bottom: 4px; font-size: 18px; }
    p { color: #666; font-size: 12px; margin-bottom: 16px; }

    #toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }

    #runBtn {
      padding: 14px 32px; font-size: 16px; cursor: pointer;
      background: #2a2a2a; color: #eee; border: 1px solid #444;
      border-radius: 6px; font-family: monospace; width: 100%;
    }
    #runBtn:hover:not(:disabled) { background: #333; }
    #runBtn:disabled { opacity: 0.5; cursor: default; }

    #duration { color: #8f8; font-size: 12px; }
    #controls { display: none; gap: 8px; flex-wrap: wrap; }
    #controls button {
      padding: 8px 16px; font-size: 12px; cursor: pointer;
      background: #2a2a2a; color: #888; border: 1px solid #333;
      border-radius: 4px; font-family: monospace;
    }
    #controls button:hover { background: #333; }

    .accordion { display: flex; flex-direction: column; gap: 4px; }

    .item { border-radius: 4px; overflow: hidden; border: 1px solid #2e2e2e; }
    .item.alert { border-color: #622; }
    .item.warn  { border-color: #542; }
    .item.ok    { border-color: #2a2a2a; }

    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; cursor: pointer; user-select: none;
      background: #222;
    }
    .header:hover { background: #262626; }
    .item.alert .header { background: #1e0e0e; }
    .item.warn  .header { background: #1a140a; }

    .arrow { font-size: 10px; color: #555; transition: transform 0.15s; flex-shrink: 0; }
    .item.open .arrow { transform: rotate(90deg); }

    .title { font-size: 12px; font-weight: bold; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; flex: 1; }
    .item.alert .title { color: #f88; }
    .item.warn  .title { color: #fa8; }
    .item.ok    .title { color: #888; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: bold; white-space: nowrap; }
    .badge.red    { background: #400; color: #f88; }
    .badge.yellow { background: #430; color: #fa8; }
    .badge.green  { background: #040; color: #8f8; }
    .badge.grey   { background: #333; color: #999; }

    .body { display: none; border-top: 1px solid #2a2a2a; background: #1e1e1e; }
    .item.open .body { display: block; }

    pre {
      padding: 12px; font-size: 11px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-all;
      color: #bbb; max-height: 500px; overflow-y: auto;
    }

    @media (min-width: 600px) {
      #runBtn { width: auto; padding: 8px 20px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <h1>Argus Integrity</h1>
  <p>Local signal collection — no API submission</p>

  <div id="toolbar">
    <button id="runBtn">Run Checks</button>
    <span id="duration"></span>
    <div id="controls">
      <button id="expandAll">Expand all</button>
      <button id="collapseAll">Collapse all</button>
    </div>
  </div>

  <div class="accordion" id="accordion"></div>

  <script type="module">
    import { collectIntegrity, runVmDetection } from '/argus.esm.js';

    const runBtn = document.getElementById('runBtn');
    const durationEl = document.getElementById('duration');
    const accordion = document.getElementById('accordion');
    const controls = document.getElementById('controls');

    document.getElementById('expandAll').addEventListener('click', () => {
      accordion.querySelectorAll('.item').forEach(el => el.classList.add('open'));
    });
    document.getElementById('collapseAll').addEventListener('click', () => {
      accordion.querySelectorAll('.item').forEach(el => el.classList.remove('open'));
    });

    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true;
      runBtn.textContent = 'Running...';
      durationEl.textContent = '';
      accordion.innerHTML = '';
      controls.style.display = 'none';

      try {
        const result = await collectIntegrity();
        const vmResult = await runVmDetection(result);
        durationEl.textContent = `${result.meta.durationMs}ms`;
        controls.style.display = 'flex';

        for (const s of buildSections(result, vmResult)) {
          accordion.appendChild(makeItem(s));
        }
      } catch (err) {
        accordion.appendChild(makeItem({
          title: 'Error', level: 'alert',
          badges: [{ text: 'EXCEPTION', color: 'red' }],
          content: `${err.message}\n\n${err.stack}`,
          open: true,
        }));
      }

      runBtn.disabled = false;
      runBtn.textContent = 'Run Again';
    });

    function makeItem({ title, level, badges = [], content, open = false }) {
      const item = document.createElement('div');
      item.className = `item ${level}${open ? ' open' : ''}`;

      const badgeHtml = badges.map(b =>
        `<span class="badge ${b.color}">${b.text}</span>`
      ).join('');

      item.innerHTML = `
        <div class="header">
          <span class="arrow">▶</span>
          <span class="title">${title}</span>
          <span class="badges">${badgeHtml}</span>
        </div>
        <div class="body"><pre>${escHtml(JSON.stringify(content, null, 2))}</pre></div>
      `;

      item.querySelector('.header').addEventListener('click', () => {
        item.classList.toggle('open');
      });

      return item;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function badge(text, color) { return { text, color }; }

    function buildSections(r, vm) {
      const sections = [];

      // Engine
      sections.push({ title: 'Engine', level: 'ok', badges: [], content: r.engine });

      // Headless
      const isHeadless = r.headless?.headless && Object.values(r.headless.headless).some(Boolean);
      const likeHeadless = r.headless?.likeHeadless && Object.values(r.headless.likeHeadless).some(Boolean);
      const stealth = r.headless?.stealth && Object.values(r.headless.stealth).some(Boolean);
      const headlessLevel = isHeadless ? 'alert' : (likeHeadless || stealth) ? 'warn' : 'ok';
      const headlessBadges = [];
      if (isHeadless) headlessBadges.push(badge('HEADLESS', 'red'));
      if (stealth) headlessBadges.push(badge('STEALTH', 'yellow'));
      else if (likeHeadless) headlessBadges.push(badge('SUSPICIOUS', 'yellow'));
      sections.push({ title: 'Headless', level: headlessLevel, badges: headlessBadges, content: r.headless, open: isHeadless });

      // Lies
      const lieCount = r.lies?.lieCount ?? 0;
      sections.push({
        title: 'Lies / Tampering',
        level: lieCount > 3 ? 'alert' : lieCount > 0 ? 'warn' : 'ok',
        badges: lieCount > 0 ? [badge(`${lieCount} lies`, lieCount > 3 ? 'red' : 'yellow')] : [],
        content: r.lies,
        open: lieCount > 0,
      });

      // Trash
      const trashCount = r.trash?.trashBin?.length ?? 0;
      sections.push({
        title: 'Trash / Validation',
        level: trashCount > 0 ? 'warn' : 'ok',
        badges: trashCount > 0 ? [badge(`${trashCount} items`, 'yellow')] : [],
        content: r.trash,
      });

      // Shielding
      const brave = r.shielding?.privacy === 'Brave';
      const tor = r.shielding?.privacy === 'Tor Browser';
      const rfp = r.shielding?.privacy === 'Firefox';
      const resBadges = [];
      if (tor) resBadges.push(badge('TOR', 'yellow'));
      if (brave) resBadges.push(badge('BRAVE', 'yellow'));
      if (rfp) resBadges.push(badge('RFP', 'yellow'));
      sections.push({ title: 'Shielding', level: resBadges.length ? 'warn' : 'ok', badges: resBadges, content: r.shielding });

      // Incognito
      sections.push({
        title: 'Incognito',
        level: 'ok',
        badges: r.incognito?.isPrivate ? [badge('PRIVATE', 'yellow')] : [],
        content: r.incognito,
      });

      // Navigator
      sections.push({ title: 'Navigator', level: 'ok', badges: [], content: r.navigator });

      // Screen
      const screenLied = r.screen?.lied;
      sections.push({
        title: 'Screen',
        level: screenLied ? 'warn' : 'ok',
        badges: screenLied ? [badge('LIED', 'yellow')] : [],
        content: r.screen,
        open: !!screenLied,
      });

      // Intl / Locale
      sections.push({ title: 'Intl / Locale', level: 'ok', badges: [], content: r.intl });

      // Timezone
      const tzLied = r.timezone?.lied;
      sections.push({
        title: 'Timezone',
        level: tzLied ? 'warn' : 'ok',
        badges: tzLied ? [badge('LIED', 'yellow')] : [],
        content: r.timezone,
      });

      // Timing
      sections.push({ title: 'Timing', level: 'ok', badges: [], content: r.timing });

      // CSS Media
      sections.push({ title: 'CSS Media', level: 'ok', badges: [], content: r.cssMedia });

      // Status
      sections.push({ title: 'Status', level: 'ok', badges: [], content: r.status });

      // WebRTC
      sections.push({ title: 'WebRTC', level: 'ok', badges: [], content: r.webrtc });

      // Worker Scope
      const wsLied = r.workerScope?.lied;
      sections.push({
        title: 'Worker Scope',
        level: wsLied ? 'warn' : 'ok',
        badges: wsLied ? [badge('LIED', 'yellow')] : [],
        content: r.workerScope,
      });

      // Errors
      const errCount = r.errors?.length ?? 0;
      if (errCount > 0) {
        sections.push({
          title: 'Captured Errors',
          level: 'warn',
          badges: [badge(`${errCount}`, 'yellow')],
          content: r.errors,
          open: true,
        });
      }

      sections.sort((a, b) => a.title.localeCompare(b.title));

      return sections;
    }
  </script>
</body>
</html>
